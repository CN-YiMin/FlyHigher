plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = '1.1.0'
group = 'dev.cnyimin.flyhigher'

base {
    archivesName = 'flyhigher-1.21.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        flyhigher {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Supplied by the pack at runtime. These jars are intentionally not bundled.
    // Put them in libs/ to compile (see libs/README.md).
    compileOnly files('libs/sable-neoforge-1.21.1-2.0.6.jar')
    compileOnly files('libs/cloth-config-15.0.140-neoforge.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
